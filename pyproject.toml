[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pc-maintenance-skill"
version = "1.2.0"
description = "Read-only macOS maintenance audit and dry-run Skill"
requires-python = ">=3.9"

[project.scripts]
pc-maintenance-skill = "pc_maintenance_skill.cli:main"

[tool.setuptools]
package-dir = {"" = "scripts"}

[tool.setuptools.packages.find]
where = ["scripts"]

[tool.pytest.ini_options]
pythonpath = ["src"]
